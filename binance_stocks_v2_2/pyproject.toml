[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bstocks-v2"
version = "2.2.0"
description = "Binance Stocks V2.2 research skeleton. Live trading is hard-disabled."
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic>=2.10", "tzdata>=2024.2", "websockets>=14"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13"]
research = ["pyarrow>=18", "exchange-calendars>=4.5", "backtrader>=1.9.78"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["bstocks_v2"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "exchange_calendars", "exchange_calendars.*", "backtrader", "backtrader.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
